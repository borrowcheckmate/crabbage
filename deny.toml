[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is a build-time macro dependency of leptos (via either_of, reactive_graph and tachys); no safe upgrade exists" },
    { id = "RUSTSEC-2023-0071", reason = "rsa, pulled in by openidconnect, is only used to verify RS256 signatures with the provider's public key; the Marvin attack needs private-key operations, and no fixed release exists" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5, pulled in by openidconnect through p256 and p384 for signature verification; the flaw affects secret-scalar arithmetic and openidconnect 4 pins this line" },
]

[licenses]
confidence-threshold = 0.95
allow = [
    "Apache-2.0",
    "EUPL-1.2",
    "MIT",
    "Unicode-3.0",
    "BSD-3-Clause", # encoding_rs and matchit, pulled in by server_fn and axum
    "BSL-1.0",      # xxhash-rust, pulled in by server_fn
    "CC0-1.0",      # base16, pulled in by leptos through wasm_split_macros
    "Zlib",         # const_format and konst (server_fn), slotmap (leptos)
    "ISC",          # ring and rustls-webpki, the TLS stack of the OpenID Connect client
    "CDLA-Permissive-2.0", # webpki-roots, the CA roots bundled into the binary for the provider
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = false
skip = [
    { crate = "miniz_oxide@0.8.9", reason = "png 0.18 directly uses miniz_oxide 0.8 and its flate2 dependency uses miniz_oxide 0.9" },
    { crate = "convert_case@0.6.0", reason = "config 0.15 (via leptos_config) needs convert_case 0.6; leptos_macro uses 0.11" },
    { crate = "syn@2.0.119", reason = "gloo-net and server_fn tooling use syn 2; leptos (tachys, async-trait) uses syn 3" },
    { crate = "syn@3.0.9", reason = "tachys and async-trait from leptos use syn 3; gloo-net and server_fn tooling use syn 2" },
    { crate = "thiserror@1.0.69", reason = "gloo-net 0.6 (via server_fn) needs thiserror 1; leptos tooling uses thiserror 2" },
    { crate = "thiserror-impl@1.0.69", reason = "gloo-net 0.6 (via server_fn) needs thiserror 1; leptos tooling uses thiserror 2" },
    { crate = "getrandom@0.3.4", reason = "rand_core 0.9 needs getrandom 0.3; uuid in leptos_macro uses 0.4" },
    { crate = "r-efi@5.3.0", reason = "getrandom 0.3 needs r-efi 5 on UEFI targets; getrandom 0.4 uses r-efi 6" },
    { crate = "hashbrown@0.16.1", reason = "hashlink 0.11 (sqlx-sqlite) needs hashbrown 0.16; indexmap (leptos) uses 0.17" },
    { crate = "base64@0.22.1", reason = "axum, leptos and sqlx need base64 0.22; reqwest (via hyper-util) and crabbage use 0.23" },
    { crate = "base64@0.21.7", reason = "openidconnect 4 needs base64 0.21" },
    { crate = "rand@0.8.8", reason = "openidconnect 4 and rsa need rand 0.8; the rest of the tree uses rand 0.9 and 0.10" },
    { crate = "rand_core@0.6.4", reason = "rand 0.8 (openidconnect, rsa) needs rand_core 0.6" },
    { crate = "rand_chacha@0.3.1", reason = "rand 0.8 (openidconnect, rsa) needs rand_chacha 0.3" },
    { crate = "getrandom@0.2.17", reason = "rand_core 0.6 (openidconnect, rsa) needs getrandom 0.2" },
    { crate = "itertools@0.10.5", reason = "openidconnect 4 needs itertools 0.10; the rest of the tree uses 0.14" },
    { crate = "windows-sys@0.52.0", reason = "ring (rustls) needs windows-sys 0.52 on Windows targets; the rest of the tree uses 0.61" },
    { crate = "tungstenite@0.28.0", reason = "chromiumoxide 0.9.1 uses async-tungstenite 0.32 and tungstenite 0.28; axum requires tungstenite 0.29" },
    { crate = "reqwest@0.13.5", reason = "chromiumoxide 0.9.1 requires reqwest 0.13; the application and OpenID Connect use reqwest 0.12" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
