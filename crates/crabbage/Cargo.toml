[package]
name = "crabbage"
description = "A Rust-based recipe book."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["recipe", "recipes", "cooking", "recipe-book"]
categories = ["web-programming"]

[lib]
crate-type = ["cdylib", "rlib"]

[[test]]
name = "server"
path = "tests/server/main.rs"
required-features = ["ssr"]

[[test]]
name = "binary"
required-features = ["ssr"]

[features]
default = []
ssr = ["leptos/ssr", "leptos_meta/ssr", "leptos_router/ssr", "dep:base64", "dep:crabbage-import", "dep:crabbage-store", "dep:futures-util", "dep:getrandom", "dep:leptos_axum", "dep:axum", "dep:openidconnect", "dep:sqlx", "dep:tokio", "dep:url"]
hydrate = ["leptos/hydrate", "dep:wasm-bindgen", "dep:web-sys"]

[dependencies]
axum = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
crabbage-domain = { version = "0.1.0", path = "../crabbage-domain" }
crabbage-import = { version = "0.1.0", path = "../crabbage-import", optional = true }
futures-util = { workspace = true, optional = true }
fastrand.workspace = true
crabbage-store = { version = "0.1.0", path = "../crabbage-store", optional = true }
getrandom = { workspace = true, optional = true }
leptos.workspace = true
leptos_axum = { workspace = true, optional = true }
leptos_meta.workspace = true
leptos_router.workspace = true
openidconnect = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
url = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, features = ["AudioContext", "AudioDestinationNode", "AudioNode", "AudioParam", "AudioScheduledSourceNode", "BaseAudioContext", "Document", "EventSource", "EventTarget", "GainNode", "MessageEvent", "Navigator", "OscillatorNode", "Storage", "Touch", "TouchEvent", "TouchList", "VisibilityState", "Window"], optional = true }

[dev-dependencies]
http-body-util.workspace = true
rsa = { version = "0.9.10", features = ["getrandom"] }
tower.workspace = true

[package.metadata.leptos]
output-name = "crabbage"
site-root = "target/site"
site-addr = "0.0.0.0:3000"
style-file = "style/main.css"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false

[lints]
workspace = true
