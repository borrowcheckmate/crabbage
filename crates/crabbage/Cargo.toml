[package]
name = "crabbage"
description = "A Rust-based recipe book."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["recipe", "recipes", "cooking", "recipe-book"]
categories = ["web-programming"]

[lib]
crate-type = ["cdylib", "rlib"]

[[test]]
name = "server"
path = "tests/server/main.rs"
required-features = ["ssr"]

[[test]]
name = "binary"
required-features = ["ssr"]

[features]
default = []
ssr = ["leptos/ssr", "leptos_meta/ssr", "dep:base64", "dep:crabbage-store", "dep:getrandom", "dep:leptos_axum", "dep:axum", "dep:openidconnect", "dep:serde", "dep:sqlx", "dep:tokio", "dep:url"]
hydrate = ["leptos/hydrate", "dep:wasm-bindgen"]

[dependencies]
axum = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
crabbage-store = { version = "0.1.0", path = "../crabbage-store", optional = true }
getrandom = { workspace = true, optional = true }
leptos.workspace = true
leptos_axum = { workspace = true, optional = true }
leptos_meta.workspace = true
openidconnect = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
url = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
http-body-util.workspace = true
rsa = { version = "0.9.10", features = ["getrandom"] }
serde_json.workspace = true
tower.workspace = true

[package.metadata.leptos]
output-name = "crabbage"
site-root = "target/site"
site-addr = "0.0.0.0:3000"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false

[lints]
workspace = true
