[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "EUPL-1.2"
repository = "https://github.com/borrowcheckmate/crabbage"

[workspace.dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "multipart", "query", "tokio"] }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
fastrand = { version = "2.5.0", default-features = false }
getrandom = { version = "0.4.3", default-features = false }
http-body-util = { version = "0.1.5", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
rsa = { version = "0.9.10", features = ["getrandom"] }
leptos = { version = "0.8.22", default-features = false }
leptos_axum = { version = "0.8.10", default-features = false, features = ["default"] } # file serving is gated behind the default feature
leptos_meta = { version = "0.8.7", default-features = false }
leptos_router = { version = "0.8.17", default-features = false }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
sha2 = { version = "0.10.9", default-features = false }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
tokio = { version = "1.54.1", default-features = false, features = ["fs", "macros", "net", "rt-multi-thread", "sync"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
url = { version = "2.5.8", default-features = false, features = ["std"] }
wasm-bindgen = { version = "0.2.130", default-features = false }
web-sys = { version = "0.3.107", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"
let_underscore_drop = "deny"
meta_variable_misuse = "deny"
missing_debug_implementations = "deny"
non_ascii_idents = "deny"
redundant_lifetimes = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
unnameable_types = "deny"
unreachable_pub = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
as_conversions = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
empty_drop = "deny"
empty_structs_with_brackets = "deny"
exit = "deny"
expect_used = "deny"
filetype_is_file = "deny"
float_cmp_const = "deny"
fn_to_numeric_cast_any = "deny"
format_push_string = "deny"
get_unwrap = "deny"
if_then_some_else_none = "deny"
indexing_slicing = "deny"
infinite_loop = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
lossy_float_literal = "deny"
map_err_ignore = "deny"
mem_forget = "deny"
mixed_read_write_in_expression = "deny"
multiple_inherent_impl = "deny"
mutex_atomic = "deny"
needless_raw_strings = "deny"
panic = "deny"
panic_in_result_fn = "deny"
print_stderr = "deny"
print_stdout = "deny"
redundant_pub_crate = "allow"
rc_buffer = "deny"
rc_mutex = "deny"
redundant_type_annotations = "deny"
renamed_function_params = "deny"
rest_pat_in_fully_bound_structs = "deny"
same_name_method = "deny"
self_named_module_files = "deny"
str_to_string = "deny"
string_add = "deny"
string_lit_chars_any = "deny"
string_slice = "deny"
suspicious_xor_used_as_pow = "deny"
todo = "deny"
try_err = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unnecessary_self_imports = "deny"
unneeded_field_pattern = "deny"
unreachable = "deny"
unused_result_ok = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
use_debug = "deny"
verbose_file_reads = "deny"
wildcard_enum_match_arm = "deny"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
